services:
  postgres:
    image: postgres:16
    container_name: pingcortex-db
    environment:
      POSTGRES_DB: ${DB_NAME:-pingcortex}
      POSTGRES_USER: ${DB_USER:-pingcortex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pingcortex}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pingcortex_pgdata:/var/lib/postgresql/data
volumes:
  pingcortex_pgdata: